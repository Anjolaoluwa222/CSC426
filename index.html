<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureAuth - Login Authentication System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0f1a;
            --bg-secondary: #111827;
            --bg-card: rgba(17, 24, 39, 0.85);
            --accent: #00d4aa;
            --accent-dim: #00a88a;
            --text-primary: #f1f5f9;
            --text-muted: #64748b;
            --border: #1e293b;
            --error: #ef4444;
            --error-bg: rgba(239, 68, 68, 0.1);
            --success: #22c55e;
            --success-bg: rgba(34, 197, 94, 0.1);
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-mesh::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: 
                radial-gradient(ellipse 600px 600px at 20% 20%, rgba(0, 212, 170, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 500px 500px at 80% 80%, rgba(59, 130, 246, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse 400px 400px at 60% 30%, rgba(168, 85, 247, 0.04) 0%, transparent 50%);
            animation: meshMove 20s ease-in-out infinite;
        }

        @keyframes meshMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(2%, 2%) rotate(1deg); }
            66% { transform: translate(-1%, 1%) rotate(-1deg); }
        }

        /* Grid Pattern */
        .grid-pattern {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image: 
                linear-gradient(rgba(0, 212, 170, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 170, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 70%);
        }

        /* Floating Particles */
        .particle {
            position: fixed;
            width: 2px;
            height: 2px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0.4;
            pointer-events: none;
            z-index: 2;
        }

        /* Main Container */
        .main-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: rgba(10, 15, 26, 0.8);
            backdrop-filter: blur(20px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 600;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon svg {
            width: 20px;
            height: 20px;
            color: var(--bg-primary);
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* Content Area */
        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* Login Card */
        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3rem;
            backdrop-filter: blur(40px);
            box-shadow: 
                0 0 0 1px rgba(0, 212, 170, 0.05),
                0 20px 50px -10px rgba(0, 0, 0, 0.5),
                0 0 100px -20px rgba(0, 212, 170, 0.1);
            animation: cardEntrance 0.6s ease-out;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.5;
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .card-title {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
        }

        .card-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 1.5rem;
            animation: fadeInUp 0.5s ease-out backwards;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.625rem;
        }

        .form-label-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: color 0.2s;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:hover {
            border-color: #2d3a4f;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.15);
        }

        .form-input:focus + .input-icon,
        .form-input:focus ~ .input-icon {
            color: var(--accent);
        }

        .form-input.error {
            border-color: var(--error);
            background: var(--error-bg);
        }

        .form-input.error:focus {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }

        .form-input.success {
            border-color: var(--success);
        }

        .form-input.success:focus {
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
        }

        /* Password Toggle */
        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.25rem;
            display: flex;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: var(--text-primary);
        }

        /* Error Message */
        .error-message {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--error);
            margin-top: 0.5rem;
            opacity: 0;
            transform: translateY(-5px);
            transition: all 0.2s;
            height: 0;
            overflow: hidden;
        }

        .error-message.visible {
            opacity: 1;
            transform: translateY(0);
            height: auto;
            padding-top: 0.25rem;
        }

        .error-message svg {
            flex-shrink: 0;
        }

        /* Global Messages */
        .global-message {
            padding: 1rem 1.25rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
            animation: messageSlide 0.3s ease-out;
            display: none;
        }

        .global-message.show {
            display: flex;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .global-message.error {
            background: var(--error-bg);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .global-message.success {
            background: var(--success-bg);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            animation: fadeInUp 0.5s ease-out 0.3s backwards;
        }

        .btn {
            flex: 1;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            border: none;
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px -5px rgba(0, 212, 170, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            border-color: var(--text-muted);
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }

        .btn-secondary:focus-visible {
            outline: 2px solid var(--text-muted);
            outline-offset: 2px;
        }

        /* Loading Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .card-footer {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            text-align: center;
            animation: fadeInUp 0.5s ease-out 0.4s backwards;
        }

        .card-footer-text {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .card-footer-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .card-footer-link:hover {
            color: var(--text-primary);
        }

        /* Password Strength */
        .password-strength {
            display: flex;
            gap: 4px;
            margin-top: 0.5rem;
        }

        .strength-bar {
            height: 3px;
            flex: 1;
            background: var(--border);
            border-radius: 2px;
            transition: background 0.2s;
        }

        .strength-bar.weak { background: var(--error); }
        .strength-bar.medium { background: var(--warning); }
        .strength-bar.strong { background: var(--success); }

        .strength-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.375rem;
            display: none;
        }

        .strength-label.show { display: block; }
        .strength-label.weak { color: var(--error); }
        .strength-label.medium { color: var(--warning); }
        .strength-label.strong { color: var(--success); }

        /* Success Animation */
        .success-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 15, 26, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .success-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .success-content {
            text-align: center;
            animation: successPop 0.4s ease-out;
        }

        @keyframes successPop {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: var(--success-bg);
            border: 2px solid var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: var(--success);
        }

        .success-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .success-text {
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .header {
                padding: 1rem 1.25rem;
            }

            .content {
                padding: 1rem;
            }

            .login-card {
                padding: 2rem 1.5rem;
                border-radius: 16px;
            }

            .card-title {
                font-size: 1.5rem;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Console Log Styles (for demo) */
        .console-log {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            width: 320px;
            max-height: 200px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            overflow: hidden;
            z-index: 50;
            display: none;
        }

        .console-log.show { display: block; }

        .console-header {
            padding: 0.5rem 0.75rem;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-muted);
        }

        .console-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
        }

        .console-body {
            padding: 0.75rem;
            max-height: 150px;
            overflow-y: auto;
        }

        .console-entry {
            padding: 0.25rem 0;
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
        }

        .console-entry:last-child { border-bottom: none; }

        .console-entry.error { color: var(--error); }
        .console-entry.success { color: var(--success); }
        .console-entry.info { color: var(--accent); }

        .timestamp {
            color: var(--text-muted);
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-mesh"></div>
    <div class="grid-pattern"></div>
    <div id="particles"></div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                </div>
                <span>SecureAuth</span>
            </div>
            <div class="header-status">
                <span class="status-dot"></span>
                <span>System Online</span>
            </div>
        </header>

        <!-- Content -->
        <main class="content">
            <div class="login-card">
                <div class="card-header">
                    <h1 class="card-title">Welcome Back</h1>
                    <p class="card-subtitle">Enter your credentials to access your account</p>
                </div>

                <!-- Global Message -->
                <div id="globalMessage" class="global-message" role="alert" aria-live="polite">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <span id="globalMessageText"></span>
                </div>

                <!-- Login Form -->
                <form id="loginForm" novalidate>
                    <!-- Username Field -->
                    <div class="form-group">
                        <label class="form-label" for="username">
                            Username
                            <span class="form-label-hint">Required</span>
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                class="form-input" 
                                placeholder="Enter your username"
                                autocomplete="username"
                                aria-describedby="usernameError"
                                required
                            >
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </div>
                        <div id="usernameError" class="error-message" role="alert">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="15" y1="9" x2="9" y2="15"/>
                                <line x1="9" y1="9" x2="15" y2="15"/>
                            </svg>
                            <span></span>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="form-group">
                        <label class="form-label" for="password">
                            Password
                            <span class="form-label-hint">Min 8 characters</span>
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-input" 
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                aria-describedby="passwordError"
                                required
                            >
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <div id="passwordError" class="error-message" role="alert">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="15" y1="9" x2="9" y2="15"/>
                                <line x1="9" y1="9" x2="15" y2="15"/>
                            </svg>
                            <span></span>
                        </div>
                        <div class="password-strength" id="strengthBars">
                            <div class="strength-bar" data-index="0"></div>
                            <div class="strength-bar" data-index="1"></div>
                            <div class="strength-bar" data-index="2"></div>
                            <div class="strength-bar" data-index="3"></div>
                        </div>
                        <div id="strengthLabel" class="strength-label"></div>
                    </div>

                    <!-- Buttons -->
                    <div class="button-group">
                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            <span id="submitText">Login</span>
                            <div class="spinner" id="spinner" style="display: none;"></div>
                        </button>
                        <button type="reset" class="btn btn-secondary" id="resetBtn">
                            Reset
                        </button>
                    </div>
                </form>

                <!-- Footer -->
                <div class="card-footer">
                    <p class="card-footer-text">
                        Don't have an account? <a href="#" class="card-footer-link">Create one</a>
                    </p>
                </div>
            </div>
        </main>
    </div>

    <!-- Success Overlay -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-content">
            <div class="success-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </div>
            <h2 class="success-title">Login Successful</h2>
            <p class="success-text">Redirecting to dashboard...</p>
        </div>
    </div>

    <!-- Console Log (Demo) -->
    <div class="console-log" id="consoleLog">
        <div class="console-header">
            <span>Validation Log</span>
            <button class="console-close" onclick="toggleConsole()" aria-label="Close console">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
        <div class="console-body" id="consoleBody"></div>
    </div>

    <script>
        // Initialize variables first
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');
        const globalMessage = document.getElementById('globalMessage');
        const globalMessageText = document.getElementById('globalMessageText');
        const submitBtn = document.getElementById('submitBtn');
        const submitText = document.getElementById('submitText');
        const spinner = document.getElementById('spinner');
        const resetBtn = document.getElementById('resetBtn');
        const passwordToggle = document.querySelector('.password-toggle');
        const eyeIcon = document.getElementById('eyeIcon');
        const strengthBars = document.querySelectorAll('.strength-bar');
        const strengthLabel = document.getElementById('strengthLabel');
        const successOverlay = document.getElementById('successOverlay');
        const consoleLog = document.getElementById('consoleLog');
        const consoleBody = document.getElementById('consoleBody');

        // Validation rules
        const validationRules = {
            username: {
                required: true,
                minLength: 3,
                maxLength: 20,
                pattern: /^[a-zA-Z0-9_]+$/,
                messages: {
                    required: 'Username is required',
                    minLength: 'Username must be at least 3 characters',
                    maxLength: 'Username cannot exceed 20 characters',
                    pattern: 'Username can only contain letters, numbers, and underscores'
                }
            },
            password: {
                required: true,
                minLength: 8,
                maxLength: 100,
                messages: {
                    required: 'Password is required',
                    minLength: 'Password must be at least 8 characters',
                    maxLength: 'Password is too long'
                }
            }
        };

        // Console log function
        function logToConsole(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `console-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="timestamp">[${time}]</span> ${message}`;
            consoleBody.appendChild(entry);
            consoleBody.scrollTop = consoleBody.scrollHeight;
            consoleLog.classList.add('show');
        }

        function toggleConsole() {
            consoleLog.classList.remove('show');
        }

        // Validate single field
        function validateField(input, rules) {
            const value = input.value.trim();
            const errors = [];

            if (rules.required && !value) {
                errors.push(rules.messages.required);
            } else if (value) {
                if (rules.minLength && value.length < rules.minLength) {
                    errors.push(rules.messages.minLength);
                }
                if (rules.maxLength && value.length > rules.maxLength) {
                    errors.push(rules.messages.maxLength);
                }
                if (rules.pattern && !rules.pattern.test(value)) {
                    errors.push(rules.messages.pattern);
                }
            }

            return errors;
        }

        // Show field error
        function showFieldError(input, errorElement, message) {
            input.classList.remove('success');
            input.classList.add('error');
            errorElement.querySelector('span').textContent = message;
            errorElement.classList.add('visible');
            logToConsole(`Validation Error: ${message}`, 'error');
        }

        // Clear field error
        function clearFieldError(input, errorElement) {
            input.classList.remove('error');
            errorElement.classList.remove('visible');
        }

        // Show field success
        function showFieldSuccess(input, errorElement) {
            clearFieldError(input, errorElement);
            input.classList.add('success');
        }

        // Show global message
        function showGlobalMessage(message, type) {
            globalMessage.className = `global-message ${type} show`;
            globalMessageText.textContent = message;
            
            const icon = globalMessage.querySelector('svg');
            if (type === 'error') {
                icon.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
            } else if (type === 'success') {
                icon.innerHTML = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>';
            }
        }

        // Hide global message
        function hideGlobalMessage() {
            globalMessage.classList.remove('show');
        }

        // Password strength calculator
        function calculatePasswordStrength(password) {
            let score = 0;
            if (password.length >= 8) score++;
            if (password.length >= 12) score++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
            if (/\d/.test(password)) score++;
            if (/[^a-zA-Z0-9]/.test(password)) score++;

            if (score <= 2) return { level: 'weak', text: 'Weak password' };
            if (score <= 3) return { level: 'medium', text: 'Medium strength' };
            return { level: 'strong', text: 'Strong password' };
        }

        // Update password strength UI
        function updatePasswordStrength(password) {
            if (!password) {
                strengthBars.forEach(bar => {
                    bar.className = 'strength-bar';
                });
                strengthLabel.className = 'strength-label';
                strengthLabel.textContent = '';
                return;
            }

            const strength = calculatePasswordStrength(password);
            const activeBars = strength.level === 'weak' ? 1 : strength.level === 'medium' ? 2 : 4;

            strengthBars.forEach((bar, index) => {
                bar.className = 'strength-bar';
                if (index < activeBars) {
                    bar.classList.add(strength.level);
                }
            });

            strengthLabel.className = `strength-label show ${strength.level}`;
            strengthLabel.textContent = strength.text;
        }

        // Username validation on blur
        usernameInput.addEventListener('blur', function() {
            const errors = validateField(this, validationRules.username);
            if (errors.length > 0) {
                showFieldError(this, usernameError, errors[0]);
            } else if (this.value.trim()) {
                showFieldSuccess(this, usernameError);
                logToConsole(`Username "${this.value}" validated successfully`, 'success');
            }
        });

        // Username validation on input
        usernameInput.addEventListener('input', function() {
            if (this.classList.contains('error')) {
                const errors = validateField(this, validationRules.username);
                if (errors.length === 0 && this.value.trim()) {
                    showFieldSuccess(this, usernameError);
                }
            }
        });

        // Password validation on blur
        passwordInput.addEventListener('blur', function() {
            const errors = validateField(this, validationRules.password);
            if (errors.length > 0) {
                showFieldError(this, passwordError, errors[0]);
            } else if (this.value.trim()) {
                showFieldSuccess(this, passwordError);
                logToConsole('Password validated successfully', 'success');
            }
        });

        // Password validation on input
        passwordInput.addEventListener('input', function() {
            updatePasswordStrength(this.value);
            
            if (this.classList.contains('error')) {
                const errors = validateField(this, validationRules.password);
                if (errors.length === 0 && this.value.trim()) {
                    showFieldSuccess(this, passwordError);
                }
            }
        });

        // Password toggle visibility
        passwordToggle.addEventListener('click', function() {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            
            if (type === 'text') {
                eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
            } else {
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            }
            
            logToConsole(`Password visibility: ${type === 'text' ? 'shown' : 'hidden'}`, 'info');
        });

        // Form submission
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideGlobalMessage();

            // Validate all fields
            const usernameErrors = validateField(usernameInput, validationRules.username);
            const passwordErrors = validateField(passwordInput, validationRules.password);

            let hasErrors = false;

            if (usernameErrors.length > 0) {
                showFieldError(usernameInput, usernameError, usernameErrors[0]);
                hasErrors = true;
            }

            if (passwordErrors.length > 0) {
                showFieldError(passwordInput, passwordError, passwordErrors[0]);
                hasErrors = true;
            }

            if (hasErrors) {
                showGlobalMessage('Please fix the errors above before submitting.', 'error');
                logToConsole('Form submission blocked due to validation errors', 'error');
                return;
            }

            // Simulate loading
            submitBtn.disabled = true;
            submitText.style.display = 'none';
            spinner.style.display = 'block';

            logToConsole('Attempting login...', 'info');

            // Simulate API call
            await new Promise(resolve => setTimeout(resolve, 1500));

            // Demo credentials check
            const validUsername = 'admin';
            const validPassword = 'password123';

            if (usernameInput.value === validUsername && passwordInput.value === validPassword) {
                logToConsole('Login successful! Redirecting...', 'success');
                submitBtn.disabled = false;
                submitText.style.display = 'inline';
                spinner.style.display = 'none';
                
                // Show success overlay
                successOverlay.classList.add('show');
                
                // Reset form after delay
                setTimeout(() => {
                    form.reset();
                    clearFieldError(usernameInput, usernameError);
                    clearFieldError(passwordInput, passwordError);
                    usernameInput.classList.remove('success');
                    passwordInput.classList.remove('success');
                    updatePasswordStrength('');
                }, 2000);
            } else {
                submitBtn.disabled = false;
                submitText.style.display = 'inline';
                spinner.style.display = 'none';
                
                showGlobalMessage('Invalid username or password. Please try again.', 'error');
                logToConsole('Authentication failed: Invalid credentials', 'error');
                
                // Shake animation for card
                const card = document.querySelector('.login-card');
                card.style.animation = 'shake 0.5s ease-in-out';
                setTimeout(() => {
                    card.style.animation = '';
                }, 500);
            }
        });

        // Reset button
        resetBtn.addEventListener('click', function() {
            clearFieldError(usernameInput, usernameError);
            clearFieldError(passwordInput, passwordError);
            usernameInput.classList.remove('success', 'error');
            passwordInput.classList.remove('success', 'error');
            hideGlobalMessage();
            updatePasswordStrength('');
            logToConsole('Form reset', 'info');
        });

        // Add shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                20%, 40%, 60%, 80% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);

        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                particle.style.animationDuration = `${10 + Math.random() * 20}s`;
                particle.style.animation = `floatParticle ${10 + Math.random() * 20}s ease-in-out infinite`;
                container.appendChild(particle);
            }
        }

        // Add particle animation
        const particleStyle = document.createElement('style');
        particleStyle.textContent = `
            @keyframes floatParticle {
                0%, 100% { 
                    transform: translate(0, 0); 
                    opacity: 0.2;
                }
                25% { 
                    transform: translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px); 
                    opacity: 0.5;
                }
                50% { 
                    transform: translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px); 
                    opacity: 0.3;
                }
                75% { 
                    transform: translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px); 
                    opacity: 0.4;
                }
            }
        `;
        document.head.appendChild(particleStyle);

        // Initialize particles
        createParticles();

        // Log initial state
        logToConsole('Authentication system initialized', 'success');

        // Demo credentials hint
        console.log('%c Demo Credentials ', 'background: #00d4aa; color: #0a0f1a; padding: 5px 10px; border-radius: 4px;');
        console.log('Username: admin');
        console.log('Password: password123');
    </script>
</body>
</html>
